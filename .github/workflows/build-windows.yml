name: Build Care Courier Windows EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python on build machine
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name "Care Courier Web Server" care_courier_server.py

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: Care-Courier-Web-Server-Windows-x64
          path: dist/Care Courier Web Server.exe
          if-no-files-found: error
          retention-days: 30
